# Echos external profile configuration example (YAML format).
# Use with: echos --config examples/echos.yaml --profile "YAML Custom Profile"
# YAML is supported as an alternative to TOML; TOML remains the default.

profiles:
  - name: "YAML Custom Profile"
    protocol: "https"
    target: "https://192.168.1.100:8443"
    base_delay_secs: 45
    jitter_percent: 15.0
    jitter_algorithm: "gaussian"
    headers:
      User-Agent: "Mozilla/5.0 (compatible; LabScanner/1.0)"
      X-Lab-ID: "detection-lab-01"

  - name: "YAML HTTP/2 Profile"
    protocol: "http2"
    target: "https://192.168.1.100:8443"
    base_delay_secs: 30
    jitter_percent: 10.0
    jitter_algorithm: "gaussian"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
      Accept-Language: "en-US,en;q=0.9"

sequences:
  - name: "yaml-recon"
    profiles:
      - "APT28"
      - "LDAP Beacon"
      - "RDP Beacon"
